versioning:
  scheme: product-release
  note: >-
    Versioning tracks the shipped product release rather than the URL. The sample repository is
    organised by product version — OnAccess/1.1.0, OnWatch/2.3.1, OnWatch/2.5.0 — and the base paths
    carry no version segment. An integration is written against the version of the appliance the
    customer has deployed.
  artifact: lifecycle/anyvision-lifecycle.yml
errors:
