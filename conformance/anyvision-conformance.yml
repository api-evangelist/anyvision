notes: >-
  AnyVision/Oosto's published posture is regulatory and ethical rather than technical: it names the
  biometric-privacy and data-protection regimes it operates under and publishes a dedicated EU AI Act
  statement, but it publishes no third-party security certification (no SOC 2, ISO 27001, PCI DSS or
  FedRAMP claim was found anywhere on the public site) and no API-level standards conformance. The
  API-standard rows below are recorded as false because nothing in the public surface evidences them —
  there is no OpenAPI, no OAuth server and no problem+json envelope to point at.
